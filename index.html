
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Sistema de Terapia</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<main class="container">

   
    <section class="login-area">

        <div class="login-box">

            <h1 class="title">Bem-vindo!</h1>

            <p class="subtitle">
                Entre na sua conta para continuar
            </p>

            <p class="profile-title">
                Como deseja acessar?
            </p>

            <!-- ESCOLHA DO TIPO DE USUÁRIO -->

            <div class="profile-options">

                <button type="button"
                    class="profile-btn active"
                    onclick="selectProfile('paciente', this)">

                    <span>🧑‍🦱</span>
                    <strong>Paciente</strong>

                </button>

                <button type="button"
                    class="profile-btn"
                    onclick="selectProfile('terapeuta', this)">

                    <span>👩‍⚕️</span>
                    <strong>Terapeuta</strong>

                </button>

            </div>

            <!-- FORMULÁRIO -->

            <form id="loginForm">

                <div class="input-group">

                    <input
                        type="email"
                        placeholder="✉  E-mail"
                        required
                    >

                </div>

                <div class="input-group">

                    <input
                        type="password"
                        placeholder="🔒  Senha"
                        required
                    >

                </div>

                <div class="options">

                    <a href="#" class="forgot">
                        Esqueceu sua senha?
                    </a>

                    <button type="submit" class="login-btn">
                        Entrar
                    </button>

                </div>

            </form>

        </div>

    </section>

    <!-- LADO DIREITO -->

    <section class="illustration">

        <div class="illustration-content">

            <div class="icon">💻</div>

            <p>Cuidar também é conectar.</p>

        </div>

    </section>

</main>
    <script src="script.js"></script>

</body>
</html>
